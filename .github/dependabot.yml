# Weekly pull requests for what is behind: the site's npm packages, and the
# actions the workflows use (setup-uv is pinned to an exact release, as it
# publishes no moving major tag, so this is what moves it).
#
# Not covered here: node itself lives in mise.toml's [tools] and the Pages
# workflow follows it, and the Python side is uv.lock; `mise run
# deps:outdated` shows both, with the npm packages, in one place.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for the build toolchain, so svelte, vite and the plugin move
    # together, as their peer ranges expect.
    groups:
      site-build:
        patterns: ["*"]
    # svelte-check (4.7.x) declares typescript "^5.0.0 || ^6.0.0" as its peer
    # range, so a TypeScript major beyond that would break `npm ci` or the type
    # check. Hold majors here; lift this once svelte-check's peer range
    # includes 7 (`npm view svelte-check peerDependencies`).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The workflows, and the shared setup steps in .github/actions/setup, which
  # hold the setup-uv and mise-action pins.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
