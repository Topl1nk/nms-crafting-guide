# Weekly pull requests for what is behind: the site's npm packages, the Python
# side (uv.lock), and the actions the workflows use (setup-uv is pinned to an
# exact release, as it publishes no moving major tag, so this is what moves it).
#
# Not covered here: node itself lives in mise.toml's [tools] and the Pages
# workflow follows it; `mise run deps:outdated` shows it, with the npm and
# Python packages, in one place.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Setting labels replaces Dependabot's defaults, so they are repeated here.
    labels: [dependencies, javascript, "area: web"]
    # One PR for the build toolchain, so svelte, vite and the plugin move
    # together, as their peer ranges expect.
    groups:
      site-build:
        patterns: ["*"]
    # svelte-check (4.7.x) declares typescript "^5.0.0 || ^6.0.0" as its peer
    # range, so a TypeScript major beyond that would break `npm ci` or the type
    # check. Hold majors here; lift this once svelte-check's peer range
    # includes 7 (`npm view svelte-check peerDependencies`).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # pyproject.toml and uv.lock: textual, mcp and the dev/extract extras, plus
  # everything they pull in. There is no python label in the repo, and these
  # serve the TUI, the MCP server and the extract alike, so the area is the
  # dependency policy itself.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, "area: tooling"]
    # One PR for the lockfile, as most bumps are transitive and land together.
    groups:
      python:
        patterns: ["*"]

  # The workflows, and the shared setup steps in .github/actions/setup, which
  # hold the setup-uv and mise-action pins.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    labels: [dependencies, "area: ci"]
