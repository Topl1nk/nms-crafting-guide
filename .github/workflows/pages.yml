# Publish web/ to GitHub Pages at nms.dlu.one: test, export data.json from the
# Python side, upload. Needs Settings -> Pages -> Source set to "GitHub
# Actions", and the custom domain set there too: a CNAME file in web/ is
# ignored by Actions deploys.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      # The runner ships node, so the web cross-checks in test_web.py run too.
      - run: uv run pytest -q
      - run: uv run python scripts/build_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
