name: Report a bug
description: Something does not work or shows a wrong number.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for telling us. A few details make it much easier to fix.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The number in the installer's file name, for example 0.1.5.
      placeholder: "0.1.5"
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Where is your game from?
      options:
        - Steam
        - GOG
        - Other
        - I do not have the game installed
  - type: input
    id: language
    attributes:
      label: Language
      description: Only if the problem is about a language or a translation.
      placeholder: Русский
