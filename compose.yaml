# Run NMSii with podman (or docker) instead of installing Python and uv.
#
#   podman compose run --rm tui     the terminal app, in this terminal
#   podman compose up site          the web version on http://localhost:8001
#   podman compose build            after a `git pull`
#   podman compose run --rm -T tui nms mcp
#                                   the MCP server for AI assistants, on stdio:
#                                   -T drops the tty, stdin_open keeps the pipe
#
# Name the service: the TUI wants this terminal, so it is started with `run`,
# not `up`. (No profile for it: podman-compose's `run` ignores profiles.)

# No pod. podman-compose otherwise creates one on the first `run` and prints
# its ID on stdout -- into the JSON-RPC stream when that run is `nms mcp`,
# which breaks the client's first connection. The two services share nothing
# a pod would give them. docker compose ignores x- keys.
x-podman:
  in_pod: false

services:
  tui:
    build:
      context: .
      target: tui
    image: localhost/nmsii:latest
    stdin_open: true
    tty: true
    environment:
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-truecolor}
    volumes:
      # What you are carrying (the inventory screen), between runs.
      - nms-state:/state
      # Addresses you save in the portals screen land in the checkout, as
      # they do outside the container, ready to share in a pull request.
      - ./data/locations.json:/app/data/locations.json:z

  site:
    build:
      context: .
      target: site
    image: localhost/nmsii-site:latest
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  nms-state:
