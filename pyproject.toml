[project]
name = "nms-items-interface"
version = "0.1.0"
description = "NMSii, the No Man's Sky Items Interface: a TUI for refining, cooking and crafting recipes"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = [
    # The TUI itself. DataTable + Tree + TabbedContent carry the whole UI.
    "textual>=1.0",
    # `nms mcp`, the server for AI assistants. A plain dependency, not an
    # extra, so the one-line configs work as written: `uv run nms mcp` and the
    # container's `nms mcp` would otherwise both need `--extra mcp`. Capped
    # below 3 because 2.0 already renamed FastMCP to MCPServer once.
    "mcp>=2.3,<3",
]

[project.scripts]
nms = "nms_items.__main__:main"

[project.optional-dependencies]
dev = [
    "textual-dev>=1.7",  # `textual console` / `textual run --dev` for live CSS
    "pytest>=8.0",
]
# Only for `mise run extract`: unpacks the game's HGPAK archives so the data
# can come from the installed game instead of a third-party JSON dump.
extract = [
    "hgpaktool==1.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nms_items"]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
