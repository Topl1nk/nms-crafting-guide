[project]
name = "nms-items"
version = "0.1.0"
description = "TUI for No Man's Sky refining, cooking and crafting recipes"
requires-python = ">=3.11"
dependencies = [
    # The TUI itself. DataTable + Tree + TabbedContent carry the whole UI.
    "textual>=1.0",
]

[project.scripts]
nms = "nms_items.__main__:main"

[project.optional-dependencies]
dev = [
    "textual-dev>=1.7",  # `textual console` / `textual run --dev` for live CSS
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nms_items"]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
